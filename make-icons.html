<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Icon maker</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;padding:24px}
  h2{margin:0 0 4px}
  p{color:#8b949e;margin:0 0 20px}
  .box{display:inline-block;margin:0 20px 20px 0;vertical-align:top;text-align:center}
  canvas{border:1px solid #30363d;border-radius:8px;display:block;margin-bottom:8px}
  button{padding:10px 14px;font-size:14px;width:100%;cursor:pointer;
         background:#1f6feb;color:#fff;border:0;border-radius:8px}
</style>
</head>
<body>
<h2>Maintenance Check Tracker — icon maker</h2>
<p>Tap all three buttons, then move the PNGs into the repo root next to index.html.</p>
<div id="wrap"></div>

<script>
function drawBase(){
  var c = document.createElement('canvas');
  c.width = 512;
  c.height = 512;
  var x = c.getContext('2d');

  x.fillStyle = '#0d1117';
  x.fillRect(0, 0, 512, 512);

  var m = 56, w = 400, r = 96;
  x.fillStyle = '#1f6feb';
  x.beginPath();
  x.moveTo(m + r, m);
  x.arcTo(m + w, m,     m + w, m + w, r);
  x.arcTo(m + w, m + w, m,     m + w, r);
  x.arcTo(m,     m + w, m,     m,     r);
  x.arcTo(m,     m,     m + w, m,     r);
  x.closePath();
  x.fill();

  x.strokeStyle = '#ffffff';
  x.lineWidth = 44;
  x.lineCap = 'round';
  x.lineJoin = 'round';
  x.beginPath();
  x.moveTo(176, 262);
  x.lineTo(238, 324);
  x.lineTo(346, 196);
  x.stroke();

  x.fillStyle = 'rgba(255,255,255,0.85)';
  for (var i = 0; i < 3; i++){
    x.fillRect(176, 356 + i * 34, 170 - i * 46, 18);
  }
  return c;
}

var base = drawBase();

function make(name, size){
  var c = document.createElement('canvas');
  c.width = size;
  c.height = size;
  var x = c.getContext('2d');
  x.fillStyle = '#0d1117';
  x.fillRect(0, 0, size, size);
  x.drawImage(base, 0, 0, size, size);

  var preview = document.createElement('canvas');
  var pv = Math.min(size, 180);
  preview.width = pv;
  preview.height = pv;
  preview.getContext('2d').drawImage(c, 0, 0, pv, pv);

  var btn = document.createElement('button');
  btn.textContent = 'Download ' + name;
  btn.onclick = function(){
    var a = document.createElement('a');
    a.href = c.toDataURL('image/png');
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  };

  var box = document.createElement('div');
  box.className = 'box';
  box.appendChild(preview);
  box.appendChild(btn);
  document.getElementById('wrap').appendChild(box);
}

make('icon-180.png', 180);
make('icon-192.png', 192);
make('icon-512.png', 512);
</script>
</body>
</html>
